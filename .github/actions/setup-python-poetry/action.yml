name: Setup Python and Poetry
description: Set up the repository's Python version and a specific Poetry version for CI jobs.

inputs:
  poetry-version:
    description: Poetry version to install
    required: false
    default: "2.1.4"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install Poetry
      shell: bash
      run: |
        pipx install poetry==${{ inputs.poetry-version }}
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

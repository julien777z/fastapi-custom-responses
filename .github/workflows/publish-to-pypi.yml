name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fastapi-custom-responses/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Setup Poetry
        uses: ./.github/actions/setup-poetry

      - name: Bump version
        id: bump
        run: python .github/scripts/bump_version.py "${{ github.event.inputs.version_increment }}"

      - name: Build package
        run: poetry build

      - name: Commit, tag, and push the version bump
        run: python .github/scripts/commit_release.py "${{ steps.bump.outputs.new }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.bump.outputs.new }}"
          name: "Release v${{ steps.bump.outputs.new }}"
          draft: false
          prerelease: false
          files: |
            dist/*

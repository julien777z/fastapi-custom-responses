name: Setup Python and Poetry
description: Set up the repository's Python version and Poetry for CI jobs.

inputs:
  python-version:
    description: Python version to set up, defaulting to the repository's .python-version.
    required: false

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        # setup-python warns when both inputs are set, so offer the file only without an override.
        python-version-file: ${{ inputs.python-version == '' && '.python-version' || '' }}

    - name: Install Poetry
      shell: bash
      run: |
        pipx install poetry==2.1.4
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

name: Setup Python and Poetry
description: Set up the repository's Python version and Poetry for CI jobs.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install Poetry
      shell: bash
      run: |
        pipx install poetry==2.1.4
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fastapi-custom-responses/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Bump version
        id: bump
        run: python .github/scripts/bump_version.py "${{ github.event.inputs.version_increment }}"

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit, tag, and push the version bump
        run: python .github/scripts/commit_release.py "${{ steps.bump.outputs.new }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.bump.outputs.new }}"
          name: "Release v${{ steps.bump.outputs.new }}"
          draft: false
          prerelease: false
          files: |
            dist/*

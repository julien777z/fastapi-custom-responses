[project]
name = "fastapi-custom-responses"
version = "0.4.0"
description = "Normalized response envelopes and error handling for FastAPI applications."
authors = [
    { name = "Julien Kmec", email = "me@julien.dev" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi>=0.139.0",
    "pydantic-super-model>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1,<27.0.0",
    "isort>=8.0.1,<10.0.0",
    "pylint>=4.0.6,<5.0.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.16.2",
]

[project.urls]
Homepage = "https://github.com/julien777z/fastapi-custom-responses"

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110

[tool.pylint.format]
max-line-length = 110

[tool.pylint.messages_control]
disable = ["missing-module-docstring"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.poetry.dependencies]
pydantic-super-model = { git = "https://github.com/julien777z/pydantic-super-model.git", branch = "main" }

[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"
